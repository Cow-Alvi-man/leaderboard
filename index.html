<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Current Leaderboard</title>
    <style>
      :root {
        --navy: #142f68;
        --blue: #0874b9;
        --row-gray: #9aa7b7;
        --row-white: #f2f3f5;
        --ink: #111318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 28px 20px;
        display: grid;
        place-items: center;
        background: #d9dada;
        font-family: "Trebuchet MS", Arial, sans-serif;
        color: var(--ink);
      }

      .leaderboard {
        width: min(850px, 100%);
        background: var(--row-white);
        box-shadow: 0 2px 12px #0003;
        overflow: hidden;
      }

      .hero {
        height: 180px;
        background: #bce4f1;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .trophy {
        position: absolute;
        top: 9px;
        width: 145px;
        height: 135px;
        filter: drop-shadow(0 1px 0 #ffffff55);
      }

      .blue-stripe {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 16px;
        background: var(--blue);
      }

      .title {
        position: relative;
        margin-top: 142px;
        width: 50%;
        min-width: 420px;
        height: 70px;
        display: grid;
        place-items: center;
        background: var(--navy);
        color: white;
        font-size: clamp(22px, 3.5vw, 38px);
        font-weight: 900;
        letter-spacing: -1px;
        text-align: center;
        white-space: nowrap;
        z-index: 1;
      }

      .rows {
        position: relative;
      }

      .row {
        min-height: 95px;
        display: grid;
        grid-template-columns: 14% 1fr 18%;
        align-items: center;
        padding: 0 9%;
        font-size: clamp(20px, 2.7vw, 29px);
        font-weight: 900;
      }

      .row:nth-child(odd) {
        background: var(--row-gray);
      }
      .row:nth-child(even) {
        background: var(--row-white);
      }

      .rank {
        text-align: center;
      }
      .name {
        padding-left: 12px;
      }
      .score {
        text-align: center;
      }

      .footer {
        min-height: 106px;
        display: grid;
        grid-template-columns: 65px minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 18px 7%;
        background: var(--row-white);
        color: #172b4d;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 18px;
      }

      .logo {
        width: 63px;
        height: 63px;
        border: 2px dotted #7691a7;
        display: grid;
        place-items: center;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 14px;
        line-height: 1.05;
        font-weight: bold;
      }

      .contact {
        line-height: 1.45;
      }
      .institution {
        text-align: right;
        white-space: nowrap;
      }

      @media (max-width: 620px) {
        body {
          padding: 14px 10px;
        }
        .hero {
          height: 150px;
        }
        .trophy {
          width: 120px;
          height: 112px;
        }
        .title {
          margin-top: 120px;
          min-width: 0;
          width: 76%;
          height: 60px;
          font-size: clamp(17px, 4vw, 25px);
          letter-spacing: 0;
        }
        .row {
          min-height: 72px;
          grid-template-columns: 13% 1fr 15%;
          padding: 0 5%;
          font-size: clamp(16px, 3.5vw, 23px);
        }
        .name {
          padding-left: 6px;
        }
        .footer {
          grid-template-columns: 52px 1fr;
          gap: 10px;
          padding: 14px 5%;
          font-size: 14px;
        }
        .logo {
          width: 50px;
          height: 55px;
          font-size: 11px;
        }
        .institution {
          grid-column: 2;
          text-align: left;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <main class="leaderboard">
      <header class="hero">
        <svg
          class="trophy"
          viewBox="0 0 160 145"
          role="img"
          aria-label="Trophy"
        >
          <!-- handles -->
          <path
            d="M43 20 H20 C16 20 14 24 15 31 C19 58 35 77 62 80
                 L62 65 C43 60 32 47 30 31 H43 Z"
            fill="#ffad35"
            stroke="#ffad35"
            stroke-width="5"
            stroke-linejoin="round"
          />
          <path
            d="M117 20 H140 C144 20 146 24 145 31 C141 58 125 77 98 80
                 L98 65 C117 60 128 47 130 31 H117 Z"
            fill="#ffad35"
            stroke="#ffad35"
            stroke-width="5"
            stroke-linejoin="round"
          />
          <!-- cup -->
          <path
            d="M43 12 H117 L113 48 C110 67 98 81 80 83
                 C62 81 50 67 47 48 Z"
            fill="#ffdf4d"
            stroke="#ffbd35"
            stroke-width="4"
            stroke-linejoin="round"
          />
          <path
            d="M80 82 V103 C80 112 68 116 59 126
                 Q54 132 62 136 H98 Q106 132 101 126
                 C92 116 80 112 80 103"
            fill="#ffd54c"
            stroke="#ffbd35"
            stroke-width="4"
            stroke-linejoin="round"
          />
          <!-- star -->
          <path
            d="M80 24 L88 39 L105 42 L93 54 L96 70 L80 62
                 L64 70 L67 54 L55 42 L72 39 Z"
            fill="#ff8d24"
            stroke="#ffad35"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <path
            d="M80 31 L85 43 L97 44 L88 52 L90 64 L80 58
                 L70 64 L72 52 L63 44 L75 43 Z"
            fill="#ffb12d"
          />
          <ellipse
            cx="112"
            cy="23"
            rx="7"
            ry="10"
            fill="#fff8a8"
            transform="rotate(-35 112 23)"
          />
          <ellipse
            cx="117"
            cy="40"
            rx="4"
            ry="5"
            fill="#fff8a8"
            transform="rotate(-35 117 40)"
          />
        </svg>
        <div class="blue-stripe"></div>
        <div class="title">CURRENT LEADERBOARD</div>
      </header>

      <section class="rows" aria-label="Leaderboard rankings">
        <div class="row">
          <div class="rank">1</div>
          <div class="name">NAME HERE</div>
          <div class="score">12</div>
        </div>
        <div class="row">
          <div class="rank">2</div>
          <div class="name">NAME HERE</div>
          <div class="score">12</div>
        </div>
        <div class="row">
          <div class="rank">3</div>
          <div class="name">NAME HERE</div>
          <div class="score">12</div>
        </div>
        <div class="row">
          <div class="rank">4</div>
          <div class="name">NAME HERE</div>
          <div class="score">12</div>
        </div>
        <div class="row">
          <div class="rank">5</div>
          <div class="name">NAME HERE</div>
          <div class="score">12</div>
        </div>
      </section>

      <footer class="footer">
        <div class="logo">YOUR<br />LOGO</div>
        <div class="contact">
          <div>www.edit.org</div>
          <div>225 E 44th Street, New York</div>
        </div>
        <div class="institution">NAME OF INSTITUTION</div>
      </footer>
    </main>
  </body>
</html>
